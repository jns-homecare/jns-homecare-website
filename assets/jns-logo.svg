<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc">
  <title id="title">JNS Home Care and Nursing Services</title>
  <desc id="desc">JNS initials framed by stepped horizontal bars, inspired by the original hand-drawn logo.</desc>
  <rect width="720" height="330" fill="#ffffff"/>
  <g fill="#102b46">
    <rect x="287" y="24" width="146" height="8" rx="2"/>
    <rect x="235" y="42" width="250" height="9" rx="2"/>
    <rect x="180" y="62" width="360" height="10" rx="2"/>
  </g>
  <g fill="#102b46" font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
    <text x="360" y="211" font-size="154" letter-spacing="-11">JNS</text>
  </g>
  <g fill="#0b9b98">
    <rect x="180" y="235" width="360" height="5" rx="2.5" opacity=".95"/>
    <rect x="235" y="250" width="250" height="7" rx="2"/>
    <rect x="287" y="267" width="146" height="7" rx="2"/>
  </g>
  <text x="360" y="310" fill="#102b46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2.4" text-anchor="middle">HOME CARE AND NURSING SERVICES</text>
</svg>
